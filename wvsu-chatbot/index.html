<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask WVSU – RAG Chatbot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Ask WVSU</h1>
        <p>A retrieval-augmented chatbot about West Virginia State University</p>
      </header>

      <div id="chat"></div>
      <div class="chips" id="chips"></div>

      <p class="note">
        Answers come from a built-in knowledge base, so figures may change. Confirm details at wvstateu.edu.
      </p>
    </div>

    <div class="bar">
      <div>
        <input id="q" placeholder="Ask about WVSU…" autocomplete="off" />
        <button id="send">Ask</button>
      </div>
    </div>

    <script src="data/wvsu-kb.js"></script>
    <script src="app.js"></script>
  </body>
</html>
